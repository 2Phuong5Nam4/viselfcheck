# pytest configuration for ViSelfCheck API tests

[tool:pytest]
markers =
    api: marks tests as API tests (requiring API keys)
    slow: marks tests as slow running
    bert_score: BERTScore method tests
    nli: NLI method tests
    mqag: MQAG method tests
    ngram: N-gram method tests
    prompt: Prompt method tests
    hybrid: Hybrid method tests
    fast: Fast running tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Console output
console_output_style = progress
addopts = -v --tb=short

# Filtering options
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
